<!DOCTYPE html>

<title>Mesothelioma TNM System and Number Staging 3D interactive map</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#fff;color:#1a1a1a;font-family:Helvetica,Arial,sans-serif}
 header{padding:18px 20px 10px;max-width:1400px;margin:0 auto}
 h1{margin:0;font-size:24px;line-height:1.25}
 .sub{color:#555;margin:6px 0 0;font-size:15px}
 .main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:0 20px;max-width:1400px;margin:0 auto;align-items:start}
 .panel{border:1px solid #e3e3e3;border-radius:10px;padding:10px;min-width:0}
 .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
 button{font:600 13px Helvetica,Arial,sans-serif;padding:7px 12px;border:1px solid #bbb;border-radius:6px;background:#f6f6f6;cursor:pointer;color:#1a1a1a}
 button:hover{background:#ececec}
 .hint{color:#777;font-size:12.5px}
 #wrap{position:relative}
 canvas{display:block;width:100%;height:440px;cursor:grab;touch-action:none}
 canvas:active{cursor:grabbing}
 #tip{position:absolute;pointer-events:none;background:#1a1a1a;color:#fff;padding:7px 10px;border-radius:6px;font-size:13px;line-height:1.4;display:none;max-width:280px;z-index:2}
 .legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;margin-top:6px}
 .legend span{display:inline-flex;align-items:center;gap:6px}
 .legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
 #anat{width:100%;height:auto;display:block}
 #cap{font-size:13.5px;line-height:1.5;color:#333;padding:8px 6px 4px;border-top:1px solid #eee;margin-top:4px}
 #cap:empty{display:none}
 .hl{transition:fill .15s,stroke .15s,stroke-width .15s,opacity .15s}
 footer{padding:10px 20px 22px;font-size:12.5px;color:#777;max-width:1400px;margin:0 auto}
 @media (max-width:900px){
  header{padding:12px 12px 8px} h1{font-size:19px} .sub{font-size:14px}
  .main{grid-template-columns:1fr;padding:0 10px;gap:10px}
  .panel{padding:8px}
  canvas{height:300px}
  .hint{width:100%}
  footer{padding:8px 12px 18px}
 }
</style></head><body>

<script>

const M0=[['1A','2','3B'],['1B','2','3B'],['1B','3A','3B'],['4','4','4']];
const TD=['parietal pleura, one side','all pleura + diaphragm or lung','chest wall, mediastinum, pericardium; still resectable','peritoneum, organs, spine, heart, other side; not resectable'];
const ND=['no nodes','same-side nodes','opposite side or above collarbone'];
const MD=['no metastasis','metastasis (distant spread, e.g. bone or liver)'];
const lg=document.getElementById('legend');
for(const k of ['1A','1B','2','3A','3B','4']) lg.insertAdjacentHTML('beforeend',`<span><i style="background:${COL[k]}"></i>Stage ${k}</span>`);
const blocks=[];
for(let m=0;m<2;m++)for(let t=0;t<4;t++)for(let n=0;n<3;n++)blocks.push({t,n,m,s:m?'4':M0[t][n]});
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),tip=document.getElementById('tip');
const HOME={yaw:1.0,pitch:0.42,zoom:1};
let yaw=HOME.yaw,pitch=HOME.pitch,zoom=1,sep=2.7,sepTarget=2.7,W=0,H=0,hover=null,polys=[];
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);draw();}
function rgb(h){h=h.slice(1);return[0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function shade(h,f){return'rgb('+rgb(h).map(c=>Math.min(255,Math.round(c*f))).join(',')+')';}
function rot(p){const[x,y,z]=p,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 const x1=x*cy-z*sy,z1=x*sy+z*cy;return[x1,y*cp+z1*sp,-y*sp+z1*cp];}
function proj(p){const r=rot(p),s=Math.min(W,H)/6.2*zoom,f=12/(12+r[2]);return[W/2-r[0]*s*f,H/2-8-r[1]*s*f,r[2]];}
const LIGHT=(()=>{const v=[0.4,1,0.6],l=Math.hypot(...v);return v.map(a=>a/l)})();
function center(b){return[b.n-1,(1-b.m)*sep-sep/2,b.t-1.5];}
function draw(){
 ctx.clearRect(0,0,W,H);polys=[];
 const w=0.44,h=0.18;
 // base plates
 for(let m=0;m<2;m++){const y=(1-m)*sep-sep/2-h-0.03;const q=[[-1.6,y,-2.1],[1.6,y,-2.1],[1.6,y,2.1],[-1.6,y,2.1]].map(proj);
  ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=m?'rgba(201,48,44,0.07)':'rgba(0,0,0,0.05)';ctx.fill();ctx.strokeStyle='#d0d0d0';ctx.stroke();}
 const order=blocks.map(b=>({b,c:center(b)})).map(o=>({...o,d:rot(o.c)[2]})).sort((a,b)=>b.d-a.d);
 for(const {b,c} of order){
  const [cx,cy,cz]=c;const V=[];for(const dx of[-w,w])for(const dy of[-h,h])for(const dz of[-w,w])V.push([cx+dx,cy+dy,cz+dz]);
  const P=V.map(proj);
  const F=[[[0,1,3,2],[-1,0,0]],[[4,5,7,6],[1,0,0]],[[0,1,5,4],[0,-1,0]],[[2,3,7,6],[0,1,0]],[[0,2,6,4],[0,0,-1]],[[1,3,7,5],[0,0,1]]];
  const isH=hover===b;
  for(const [idx,nrm] of F){
   const nr=rot(nrm);if(nr[2]>0.0001)continue; // facing away (camera looks toward +z)
   const lam=0.62+0.45*Math.max(0,nrm[0]*LIGHT[0]+nrm[1]*LIGHT[1]+nrm[2]*LIGHT[2]);
   const pts=idx.map(i=>P[i]);
   ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
   ctx.fillStyle=shade(COL[b.s],isH?lam*1.18:lam);ctx.fill();ctx.strokeStyle=isH?'#1a1a1a':'rgba(255,255,255,0.9)';ctx.lineWidth=isH?2:1;ctx.stroke();
   polys.push({b,pts});
   if(nrm[1]!==0){const p=proj([cx,cy+nrm[1]*h,cz]);ctx.fillStyle='#fff';ctx.font='700 '+Math.round(15*zoom)+'px Helvetica,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.s,p[0],p[1]);}
  }
 }
 // axis labels
 ctx.fillStyle='#1a1a1a';ctx.font='700 14px Helvetica,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 const yb=sep/2-0.25;
 for(let t=0;t<4;t++){const p=proj([-2.05,yb,t-1.5]);ctx.fillText('T'+(t+1),p[0],p[1]);}
 for(let n=0;n<3;n++){const p=proj([n-1,yb,-2.45]);ctx.fillText('N'+n,p[0],p[1]);}
 for(let m=0;m<2;m++){const yy=(1-m)*sep-sep/2-0.2;const q=[[-1.6,yy,-2.1],[1.6,yy,-2.1],[1.6,yy,2.1],[-1.6,yy,2.1]].map(proj);
 const minX=Math.min(...q.map(r=>r[0])),minY=Math.min(...q.map(r=>r[1])),maxY=Math.max(...q.map(r=>r[1]));
 const lt=m?'M1 (metastasis)':'M0 (no metastasis)';ctx.font='700 15px Helvetica,Arial,sans-serif';ctx.textAlign='left';ctx.fillStyle=m?'#C9302C':'#1a1a1a';
 const x=Math.max(6,minX),y=m?Math.min(H-8,maxY+22):Math.max(16,minY-(m?0:28));
 ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.strokeText(lt,x,y);ctx.fillText(lt,x,y);}
}
function hit(x,y){for(let i=polys.length-1;i>=0;i--){const q=polys[i].pts;let c=false;for(let a=0,b=q.length-1;a<q.length;b=a++){if(((q[a][1]>y)!=(q[b][1]>y))&&(x<(q[b][0]-q[a][0])*(y-q[a][1])/(q[b][1]-q[a][1])+q[a][0]))c=!c;}if(c)return polys[i].b;}return null;}
let drag=null,lastDragDist=0,lastType='mouse';
cv.addEventListener('pointerdown',e=>{lastType=e.pointerType;drag={x:e.clientX,y:e.clientY,yaw,pitch};cv.setPointerCapture(e.pointerId);tip.style.display='none';});
cv.addEventListener('pointerup',e=>{lastDragDist=drag?Math.hypot(e.clientX-drag.x,e.clientY-drag.y):0;drag=null;});
cv.addEventListener('pointermove',e=>{
 if(drag){yaw=drag.yaw-(e.clientX-drag.x)*0.008;pitch=Math.max(-1.45,Math.min(1.45,drag.pitch+(e.clientY-drag.y)*0.008));draw();return;}
 const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,b=hit(x,y);
 if(b!==hover){hover=b;draw();if(!pinned)highlight(b);}
 if(b)showTip(b,x,y);else tip.style.display='none';
});
cv.addEventListener('pointerleave',e=>{if(e.pointerType!=='mouse')return;hover=null;tip.style.display='none';draw();if(!pinned)highlight(null);});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.5,Math.min(2.5,zoom*Math.exp(-e.deltaY*0.001)));draw();},{passive:false});
const sb=document.getElementById('sep');
sb.onclick=()=>{sepTarget=sepTarget>1?0.42:2.7;sb.textContent=sepTarget>1?'Stack layers':'Separate layers';anim();};
document.getElementById('reset').onclick=()=>{yaw=HOME.yaw;pitch=HOME.pitch;zoom=1;draw();};
function anim(){const d=sepTarget-sep;if(Math.abs(d)<0.01){sep=sepTarget;draw();return;}sep+=d*0.18;draw();requestAnimationFrame(anim);}
window.addEventListener('resize',resize);resize();
const TSET=[['parR'],['parR','visR','diaR','lungInv']];
TSET.push([...TSET[1],'cwFocal','medFat','peri']);
TSET.push([...TSET[2],'cwDiffuse','ribsR','perit','heart','spine','parL']);
const NSET=[[],['n1'],['n2c','n2s']];
const MSET=[[],['liver','bone']];
const DESC={parR:'parietal pleura (same side)',visR:'visceral pleura',diaR:'diaphragm muscle',lungInv:'lung tissue',
 cwFocal:'one resectable focus of chest wall soft tissue',medFat:'mediastinal fat',peri:'pericardium (not through it)',
 cwDiffuse:'diffuse chest wall spread',ribsR:'ribs',perit:'peritoneum (through the diaphragm)',heart:'heart muscle',spine:'spine',parL:'opposite-side pleura',
 n1:'same-side hilar and mediastinal nodes',n2c:'opposite-side mediastinal nodes',n2s:'supraclavicular nodes (either side)',
 liver:'liver',bone:'bone'};
const HL=[...document.querySelectorAll('#anat .hl')];
const cap=document.getElementById('cap');
const CAP0='';
let pinned=null;
function showTip(b,x,y){tip.innerHTML=`<b>T${b.t+1} N${b.n} M${b.m} → stage ${b.s}</b><br>T${b.t+1}: ${TD[b.t]}<br>N${b.n}: ${ND[b.n]}<br>M${b.m}: ${MD[b.m]}`;
 tip.style.display='block';const tw=tip.offsetWidth,th=tip.offsetHeight;
 tip.style.left=Math.max(4,Math.min(x+14,W-tw-4))+'px';tip.style.top=(y+14+th>H?Math.max(4,y-th-10):y+14)+'px';}
function highlight(b){
 for(const el of HL){el.style.fill='';el.style.stroke='';el.style.strokeWidth='';el.style.opacity='';el.style.filter='';}
 if(!b){cap.innerHTML=CAP0;return;}
 const col=COL[b.s],T=TSET[b.t],N=NSET[b.n],M=MSET[b.m],keys=new Set([...T,...N,...M]);
 for(const el of HL){if(!keys.has(el.dataset.k))continue;
  if(el.dataset.m==='fill'){el.style.fill=col;el.style.opacity='1';el.style.stroke=shade(col,0.7);}
  else{el.style.stroke=col;el.style.opacity='1';if(el.dataset.w)el.style.strokeWidth=el.dataset.w;else if(el.dataset.k==='perit')el.style.strokeWidth='4';else if(el.dataset.k==='diaR')el.style.strokeWidth='11';else if(el.dataset.k==='peri')el.style.strokeWidth='5';}
  el.style.filter='drop-shadow(0 0 2px '+col+')';}
 const list=k=>k.map(x=>DESC[x]).join(', ');
 cap.innerHTML=`<b>T${b.t+1} N${b.n} M${b.m} → stage ${b.s}</b><br>`+
  `<b>T${b.t+1}:</b> ${list(T)}<br><b>N${b.n}:</b> ${N.length?list(N):'no nodes involved'}<br><b>M${b.m}:</b> ${M.length?'distant spread, e.g. '+list(M):'no distant spread'}`;
}
cv.addEventListener('click',e=>{if(lastDragDist>6)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,b=hit(x,y);pinned=(b&&b!==pinned)?b:null;
 if(lastType!=='mouse'){hover=pinned;draw();if(pinned)showTip(pinned,x,y);else tip.style.display='none';}
 highlight(pinned||(lastType==='mouse'?b:null));});
highlight(null);

</script></body></html>
